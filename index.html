    <title>Stochastic — The Generative Music Engine</title>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Stochastic",
      "url": "https://stochastic-music.com/",
      "image": "https://stochastic-music.com/og-image.png",
      "alternateName": "Stochastic — The Generative Music Engine",
      "description": "A node-based generative music environment where space is time: compose by building geometric graphs whose distances become rhythm and whose topology becomes melody. Real-time synthesis, probability gates, quantizers, evolving melodies, scenes and arrangement, WAV export.",
      "applicationCategory": "MultimediaApplication",
      "applicationSubCategory": "Music Composition",
      "operatingSystem": "Web browser",
      "browserRequirements": "Requires a desktop browser with Web Audio support",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
      "featureList": "Node-based composition, generative sequencing, real-time synthesis, probability gates, genetic melody evolution, scene arrangement, WAV export, 50+ built-in examples"
    }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #e0e0e0;
      }
      
      /* Prevent text selection during drag */
      .no-select {
        user-select: none;
        -webkit-user-select: none;
      }
    </style>

  <body class="no-select">
    <div id="root"></div>
    <noscript>
      <h1>Stochastic — The Generative Music Engine</h1>
      <p>
        Stochastic is a free, browser-based environment for composing generative
        music with node graphs. The core idea: <strong>space is time</strong> —
        musical events travel along the edges you draw, so the distance between
        nodes sets the rhythm and the shape of the graph writes the melody.
        Build instruments from oscillators, filters, and envelopes; add
        probability gates, quantizers, and evolving melodies; arrange scenes on
        a timeline and export to WAV. Stochastic requires JavaScript and a
        desktop browser with Web Audio support.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>

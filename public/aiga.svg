<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g stroke="#222" stroke-width="0.5" opacity="0.5">
    <line x1="20" y1="0" x2="20" y2="100"/>
    <line x1="40" y1="0" x2="40" y2="100"/>
    <line x1="60" y1="0" x2="60" y2="100"/>
    <line x1="80" y1="0" x2="80" y2="100"/>
    <line x1="0" y1="20" x2="100" y2="20"/>
    <line x1="0" y1="40" x2="100" y2="40"/>
    <line x1="0" y1="60" x2="100" y2="60"/>
    <line x1="0" y1="80" x2="100" y2="80"/>
  </g>
  
  <!-- Edge -->
  <line x1="25" y1="30" x2="75" y2="70" stroke="#444" stroke-width="3"/>
  
  <!-- Packet -->
  <circle cx="50" cy="50" r="5" fill="#4caf50">
    <animate attributeName="cx" values="25;75;25" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;70;30" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Source node -->
  <circle cx="25" cy="30" r="12" fill="#4caf50"/>
  <text x="25" y="35" font-size="12" fill="white" text-anchor="middle">◉</text>
  
  <!-- Speaker node -->
  <circle cx="75" cy="70" r="12" fill="#ff5722"/>
  <text x="75" y="75" font-size="10" fill="white" text-anchor="middle">🔊</text>
</svg>
